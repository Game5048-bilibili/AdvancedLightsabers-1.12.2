plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '5.1.+'
}

group = 'com.fiskmods.lightsabers'
version = '1.3.0'
archivesBaseName = "AdvancedLightsabers"

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
    mappings channel: 'stable', version: '39'
    runs {
        client { workingDirectory project.file('run') }
        server { workingDirectory project.file('run') }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2854'
}

jar {
    destinationDirectory = file('jars')
    manifest {
        attributes 'FMLCorePlugin': 'com.fiskmods.lightsabers.asm.ALLoadingPlugin'
        attributes 'FMLCorePluginContainsFMLMod': 'true'
        attributes 'Main-Class': 'com.fiskmods.lightsabers.saberbuilder.SaberBuilder'
        attributes 'Class-Path': '.'
    }
}

processResources {
    inputs.property 'version', version
    inputs.property 'mcversion', minecraft.version

    filesMatching('mcmod.info') {
        expand 'version': version, 'mcversion': minecraft.version
    }
}
