buildscript {
    repositories {
        maven { url = 'https://files.minecraftforge.net/maven' }
        jcenter()
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}
apply plugin: 'forge'

version = "1.3.0"
group = "com.fiskmods.lightsabers"
archivesBaseName = "AdvancedLightsabers"

sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    version = "1.12.2-14.23.5.2854"
    runDir = "run"
    mappings = "stable_39"
}

dependencies {
    // 1.12.2 用户 dev 依赖
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    destinationDir = file('jars')
    manifest {
        attributes 'FMLCorePlugin': 'com.fiskmods.lightsabers.asm.ALLoadingPlugin'
        attributes 'FMLCorePluginContainsFMLMod': 'true'
        attributes 'Main-Class': 'com.fiskmods.lightsabers.saberbuilder.SaberBuilder'
        attributes 'Class-Path': '.'
    }
}
