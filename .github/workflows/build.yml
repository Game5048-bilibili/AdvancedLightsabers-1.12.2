name: Build 1.12.2 Jar

on:
  push:
    branches: [ "1.2-1.12.2" ]   # 你的主分支名
  workflow_dispatch:             # 手动按钮也保留

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
    - name: Make gradlew executable
      run: chmod +x gradlew
    - name: Build
      run: ./gradlew build
    - name: Upload jar
      uses: actions/upload-artifact@v4
      with:
        name: compiled-mod
        path: build/libs/*.jar
